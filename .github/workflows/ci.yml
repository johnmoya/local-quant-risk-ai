name: CI

on:
  push:
    # Listing only `tags` would stop branch pushes from triggering the
    # workflow, so both are explicit: every branch, and every release tag.
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Use the interpreter from setup-python, never a uv-downloaded one.
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
          python-version: ${{ matrix.python-version }}

      # --locked installs exactly what uv.lock pins and fails if uv.lock is
      # out of date with pyproject.toml (--frozen would silently use the
      # stale lock). Unpinned tool versions already caused drift twice
      # (mypy in M5, ruff format in M9).
      # `forecasting` (arch, xgboost-cpu) is the M13/M14 estimation extra:
      # the GARCH and XGBoost fitting tests need it on both legs.
      - name: Install dependencies from uv.lock
        run: uv sync --locked --extra dev --extra forecasting

      # v1.0.0-v1.0.2 were tagged while the package declared 0.1.0. A release
      # tag must now name the version the installed package reports.
      - name: Release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: >-
          uv run --no-sync python -c
          "import sys, quant_risk_ai as q; tag = sys.argv[1];
          sys.exit(None if tag == 'v' + q.__version__
          else f'tag {tag} does not match package version {q.__version__}')"
          "$GITHUB_REF_NAME"

      - name: Tool versions
        run: |
          uv run --no-sync python --version
          uv run --no-sync python -c "import numpy, scipy, pandas; print('numpy', numpy.__version__, 'scipy', scipy.__version__, 'pandas', pandas.__version__)"
          uv run --no-sync python -c "import arch, xgboost; print('arch', arch.__version__, 'xgboost', xgboost.__version__)"
          uv run --no-sync ruff --version
          uv run --no-sync mypy --version

      - name: pytest
        run: uv run --no-sync pytest

      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: ruff format --check
        run: uv run --no-sync ruff format --check .

      # uv.lock resolves a newer numpy for 3.12 whose stubs use 3.12-only
      # syntax, so each leg type-checks against its own interpreter version.
      # pyproject.toml's python_version = "3.11" stays the local default, and
      # the 3.11 leg keeps guaranteeing 3.11 compatibility.
      # research/ is included even though CI does not install the `research`
      # extra: yfinance and matplotlib are declared ignore_missing_imports in
      # pyproject.toml, so the research scripts stay type-checked without
      # pulling their dependencies into CI. arch and xgboost (`forecasting`)
      # are installed and ship their own type information.
      - name: mypy
        run: >-
          uv run --no-sync mypy --python-version ${{ matrix.python-version }}
          src tests research
