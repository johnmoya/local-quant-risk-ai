[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-risk-ai"
version = "1.1.0"
description = "Local quantitative risk analytics engine (VaR, ES, backtesting) with a FastAPI service and an Ollama-backed natural-language explanation layer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "johnmoya" }]

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.9",
    "pandas-stubs>=2.2",
    # starlette.testclient imports httpx2 first and only falls back to httpx
    # with a deprecation warning. Test-only: the app's own Ollama client
    # stays on httpx, a runtime dependency.
    "httpx2>=2.13",
]
# Research-only, deliberately NOT runtime dependencies: nothing under
# src/quant_risk_ai imports these, so the API and the risk engine ship
# without them and CI keeps installing only the `dev` extra. They exist
# for the scripts under research/ (see docs/research_design_real_data.md).
# yfinance is needed only to *refresh* data/research/SPY_prices.csv, which
# is committed — reproducing the study needs neither it nor a network.
research = [
    "yfinance>=1.7",
    "matplotlib>=3.8",
]
# M13/M14 model estimation (docs/design_m13.md §12), also research-only:
# arch fits GARCH(1,1) and xgboost (CPU-only wheel, no CUDA/NCCL) the M14
# forecasts. risk/ never imports either; it receives fitted parameters, so
# the API and its Docker image do not change. CI installs this extra so
# the fitting tests run on both legs.
forecasting = [
    "arch>=7.2",
    "xgboost-cpu>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quant_risk_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Tests against a real Ollama are deselected by default (CI has none); run
# them with `QUANT_RISK_AI_OLLAMA_TESTS=1 pytest -m ollama`.
addopts = "-ra --strict-markers -m 'not ollama'"
markers = [
    "ollama: needs a running Ollama with the configured model (see tests/integration)",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's `Depends(...)` (and Query/Path/etc.) as a parameter default is
# the framework's own dependency-injection idiom, not the mutable-default
# footgun B008 exists to catch (fastapi.Depends since M7's /explain
# endpoint, added here rather than a per-line `# noqa` so future endpoints
# don't need one either).
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
# No python_version pin: mypy follows the interpreter it runs under. Pinning
# 3.11 made a plain `mypy src tests` fail on a 3.12 interpreter, because
# uv.lock resolves numpy 2.5.3 there and its stubs use PEP 695 `type`
# statements, which are a syntax error under a 3.11 target. CI passes
# --python-version per matrix leg, and the 3.11 leg is what guarantees 3.11
# compatibility.
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# scipy ships no py.typed marker (unlike pandas, covered by pandas-stubs
# above), so mypy can't see into scipy.stats (norm.ppf/pdf, used starting
# M3's parametric VaR/ES) without this.
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Research-extra packages: CI installs only the `dev` extra, so these are
# absent when research/ is type-checked there. Neither ships type stubs.
module = ["yfinance.*", "matplotlib.*"]
ignore_missing_imports = true
